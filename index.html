<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Fire ID Lookup</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg,#0f0c29,#302b63,#24243e);
    padding:20px;
  }
  .container {
    width:100%; max-width:460px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(14px);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:20px; padding:28px 22px;
    box-shadow:0 20px 50px rgba(0,0,0,0.55);
    color:#fff; text-align:center;
  }
  h1 {
    font-size:22px; margin-bottom:6px;
    background: linear-gradient(90deg,#ff6a00,#ee0979);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  }
  .sub { font-size:13px; color:#bbb; margin-bottom:20px; }
  input {
    width:100%; padding:14px 16px; border-radius:12px;
    border:1px solid rgba(255,255,255,0.2);
    background: rgba(0,0,0,0.3); color:#fff; font-size:15px;
    outline:none; margin-bottom:12px;
  }
  input:focus { border-color:#ff6a00; }
  button {
    width:100%; padding:14px; border:none; border-radius:12px;
    background: linear-gradient(90deg,#ff6a00,#ee0979);
    color:#fff; font-size:16px; font-weight:bold; cursor:pointer;
  }
  button:disabled { opacity:.6; }
  #loading { display:none; margin-top:18px; color:#ff6a00; font-size:14px; }
  .spinner {
    width:32px; height:32px; border:3px solid rgba(255,255,255,.2);
    border-top-color:#ff6a00; border-radius:50%;
    animation:spin .8s linear infinite; margin:0 auto 8px;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  #error { display:none; margin-top:16px; color:#ff4d4d; font-size:14px; }
  #result { margin-top:20px; display:none; text-align:left; }
  .card {
    background: rgba(0,0,0,0.35);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:16px; padding:16px; margin-bottom:12px;
  }
  .top { display:flex; align-items:center; gap:14px; margin-bottom:14px; }
  .avatar-box {
    width:76px; height:76px; border-radius:50%;
    border:3px solid #ff6a00; overflow:hidden;
    background:#222; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:26px; font-weight:bold; color:#ff6a00;
  }
  .avatar-box img { width:100%; height:100%; object-fit:cover; }
  .top .info h2 { font-size:18px; margin-bottom:4px; }
  .top .info p { font-size:12px; color:#aaa; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .stat { background: rgba(255,255,255,0.06); padding:10px; border-radius:10px; font-size:13px; }
  .stat span { display:block; color:#aaa; font-size:11px; margin-bottom:2px; }
  .stat b { color:#ffb37a; font-size:14px; }
  .sig {
    font-size:12px; color:#ccc; font-style:italic;
    margin-top:10px; padding:10px; border-left:3px solid #ff6a00;
    background: rgba(255,106,0,.08); border-radius:6px;
  }
  .clan {
    margin-top:12px; padding:10px; border-radius:10px;
    background: linear-gradient(90deg,rgba(255,106,0,.15),rgba(238,9,121,.15));
    font-size:13px;
  }
  .cardimg-wrap {
    margin-top:14px; border-radius:12px; overflow:hidden;
    border:1px solid rgba(255,255,255,.15);
    background:#111; min-height:80px;
    display:flex; align-items:center; justify-content:center;
  }
  .cardimg-wrap img { width:100%; display:block; }
  .cardimg-wrap .ph { color:#666; font-size:12px; padding:20px; text-align:center; }
</style>
</head>
<body>
<div class="container">
  <h1>🎮 Free Fire ID Lookup</h1>
  <p class="sub">ඔබේ Free Fire UID එක ඇතුළත් කරන්න</p>

  <input type="text" id="uid" placeholder="උදා: 9590321127" inputmode="numeric" />
  <button id="searchBtn">සොයන්න 🔍</button>

  <div id="loading"><div class="spinner"></div><p>ලෝඩ් වෙමින්...</p></div>
  <div id="error"></div>
  <div id="result"></div>
</div>

<script>
  const btn = document.getElementById('searchBtn');
  const input = document.getElementById('uid');
  const loading = document.getElementById('loading');
  const errorEl = document.getElementById('error');
  const resultEl = document.getElementById('result');

  btn.addEventListener('click', search);
  input.addEventListener('keypress', e => { if (e.key === 'Enter') search(); });

  async function search() {
    const uid = input.value.trim();
    if (!/^\d{6,15}$/.test(uid)) return showError('UID එක අංක වලින් විය යුතුය');

    resultEl.style.display = 'none';
    errorEl.style.display = 'none';
    loading.style.display = 'block';
    btn.disabled = true;

    try {
      // 👇 Vercel backend එකට call කරනවා
      const res = await fetch(`/api/ff?uid=${uid}`);
      const json = await res.json();
      if (!json.status || !json.data) throw new Error('Player හමු නොවීය');
      render(json, uid);
    } catch (e) {
      showError('❌ ' + e.message);
    } finally {
      loading.style.display = 'none';
      btn.disabled = false;
    }
  }

  function render(json, uid) {
    const d = json.data;
    const initials = (d.nickname || 'FF').trim().slice(0,2).toUpperCase();
    const gender = (d.gender || '').replace('Gender_','') || '-';
    // 👇 Card image එක proxy හරහා load කරනවා
    const cardUrl = `/api/card?uid=${uid}&style=1`;

    resultEl.innerHTML = `
      <div class="card">
        <div class="top">
          <div class="avatar-box">
            <img src="${cardUrl}" alt="FF" onerror="this.parentNode.innerHTML='${initials}'">
          </div>
          <div class="info">
            <h2>${esc(d.nickname || 'Unknown')}</h2>
            <p>UID: ${uid}</p>
            <p>${gender} • ${d.region} • Level ${d.level}</p>
          </div>
        </div>
        <div class="grid">
          <div class="stat"><span>Level</span><b>${d.level}</b></div>
          <div class="stat"><span>BR Rank</span><b>${d.rank}</b></div>
          <div class="stat"><span>BR Points</span><b>${d.rankingPoints}</b></div>
          <div class="stat"><span>CS Rank</span><b>${d.csRank}</b></div>
          <div class="stat"><span>Likes</span><b>❤️ ${d.liked}</b></div>
          <div class="stat"><span>Badges</span><b>${d.badgeCount}</b></div>
          <div class="stat"><span>Prime</span><b>Lv ${d.primeLevel}</b></div>
          <div class="stat"><span>Created</span><b>${d.createAt}</b></div>
        </div>
        ${d.signature ? `<div class="sig">${esc(d.signature.replace(/\\[\\/?[a-z0-9=]+.*?\\]/gi,''))}</div>` : ''}
        ${d.clan ? `<div class="clan">🛡️ <b>${esc(d.clan.name)}</b><br>
                    ID: ${d.clan.id} • Lv ${d.clan.level} • ${d.clan.members}/${d.clan.capacity}</div>` : ''}
        <div class="cardimg-wrap">
          <img src="${cardUrl}" onerror="this.parentNode.innerHTML='<div class=\\'ph\\'>Card එක load කරන්න බෑ</div>'">
        </div>
      </div>`;
    resultEl.style.display = 'block';
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
  function showError(m) { errorEl.textContent = m; errorEl.style.display = 'block'; }
</script>
</body>
</html>
